include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # example/ is deliberately not excluded. It was, and the gallery's own
    # tests broke for several commits without the root analyze noticing.
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    public_member_api_docs: true
