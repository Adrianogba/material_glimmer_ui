name: material_glimmer_ui
description: A Flutter UI kit of glass surfaces and lit edges. An app widget, a theme, a full token set and a widget library. Inspired by Jetpack Compose Glimmer and Material Design.
version: 0.7.0
homepage: https://github.com/Adrianogba/material_glimmer_ui
repository: https://github.com/Adrianogba/material_glimmer_ui
issue_tracker: https://github.com/Adrianogba/material_glimmer_ui/issues
funding:
  - https://github.com/sponsors/Adrianogba

topics:
  - glimmer
  - design-system
  - ui
  - theme
  - widgets

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
